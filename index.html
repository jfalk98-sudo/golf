<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Golf Scorecard App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .table-wrapper { overflow: auto; flex: 1; position: relative; max-height: calc(100vh - 220px); }
        table { width: 100%; border-collapse: collapse; border-spacing: 0; }
        th, td { padding: 0.75rem 0.5rem; text-align: center; border-bottom: 1px solid #374151; white-space: nowrap; background: #030712; }
        thead th { position: sticky; top: 0; z-index: 30; background: #111827 !important; border-bottom: 2px solid #374151; }
        .sticky-col { position: sticky; left: 0; background: #111827; border-right: 1px solid #374151; z-index: 20; font-weight: 900; color: #9ca3af; }
        thead th.sticky-col { z-index: 40; background: #111827 !important; }
        .row-tot td { background: #1f2937 !important; color: #facc15; font-weight: 900; }
        .row-pts td { background: #581c87 !important; color: #f0abfc; font-weight: 900; }
    </style>
</head>
<body class="h-[100dvh] overflow-hidden flex justify-center bg-black selection:bg-green-500/30">

    <div class="w-full max-w-md bg-[#030712] relative flex flex-col shadow-2xl h-[100dvh] overflow-hidden" id="app">
        <!-- Application container rendered dynamically via script -->
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                var swCode = "self.addEventListener('install', function(e) { e.waitUntil(caches.open('golf-v3').then(function(cache) { return cache.addAll(['./']); })); }); self.addEventListener('fetch', function(e) { e.respondWith(caches.match(e.request).then(function(res) { return res || fetch(e.request); })); });";
                var blob = new Blob([swCode], { type: 'text/javascript' });
                var swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(function(err) { console.log('SW registration failed', err); });
            });
        }

        var gameModeInstructions = {
            'Bingo Bango Bongo': 'Points based game: 1 pt for first on green (Bingo), 1 pt for closest to pin (Bango), 1 pt for first in hole (Bongo).',
            'Wolf': 'A rotation game (min 3 players). Lone Wolf win awards 2 pts + carryover. Lone Wolf loss awards opponents 2 pts + carryover. Ties add +1 carryover. Partner selection is mandatory.',
            'Vegas': 'Teams combined. 4 players (2v2) or 3 players (rotating partner). Winning team gets positive difference. Birdie toggle flips opposing team score.',
            'Stableford': 'Points: 1 for bogey, 2 for par, 3 for birdie, 4 for eagle, 5 for hole-in-one.',
            'Nines': 'A 3-player game where 9 points are awarded per hole (5-3-1 distribution).'
        };

        var state = {
            view: 'setup', 
            gameMode: 'Bingo Bango Bongo',
            numPlayers: 2,
            playerNames: ['Player 1', 'Player 2', 'Player 3', 'Player 4'],
            players: [],
            currentHole: 1,
            startingHole: 1,
            tempScores: {},
            bbbWinners: { bingo: null, bango: null, bongo: null },
            wolfPartner: null,
            initialWolfIndex: 0,
            carryover: 0,
            holePars: Array(18).fill(4),
            vegasBirdies: { team1: false, team2: false, p1: false, p2: false, p3: false },
            showInfo: null,
            showHomeConfirm: false,
            errorMessage: null
        };

        function saveToStorage() {
            try {
                localStorage.setItem('golf_app_state', JSON.stringify(state));
            } catch (e) {
                console.error('Could not save to storage', e);
            }
        }

        function loadFromStorage() {
            try {
                var saved = localStorage.getItem('golf_app_state');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    if (parsed && parsed.players && parsed.players.length > 0) {
                        state = parsed;
                    }
                }
            } catch (e) {
                console.error('Could not load from storage', e);
            }
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, function(tag) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[tag] || tag;
            });
        }

        function render() {
            var app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = renderHeader() + renderMainContent() + renderModals();
            saveToStorage();
        }

        function renderHeader() {
            return '<header class="bg-gray-900 p-3 flex justify-between items-center border-b border-gray-800 shrink-0 z-50">' +
                '<div class="flex items-center gap-2">' +
                    '<div class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center shadow-lg shadow-green-500/20">' +
                        '<div class="w-3 h-3 bg-white rounded-full"></div>' +
                    '</div>' +
                    '<div>' +
                        '<h1 class="text-white font-black tracking-tight leading-tight text-sm">GolfApp</h1>' +
                        '<p class="text-gray-400 text-[10px] uppercase tracking-widest font-bold">' + state.gameMode + '</p>' +
                    '</div>' +
                '</div>' +
                '<div class="flex gap-2">' +
                    (state.view !== 'setup' ? 
                        '<button onclick="state.showHomeConfirm = true; render();" class="p-2 bg-gray-800 text-gray-300 rounded-lg hover:bg-gray-700 active:scale-95 transition-colors">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' +
                        '</button>' +
                        '<button onclick="state.view = state.view === \'play\' ? \'scorecard\' : \'play\'; render();" class="bg-gray-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-gray-700 active:scale-95 transition-colors">' +
                            (state.view === 'play' ? 'Scorecard' : 'Play') +
                        '</button>'
                    : '') +
                '</div>' +
            '</header>';
        }

        function renderMainContent() {
            if (state.view === 'setup') return renderSetupView();
            if (state.view === 'play') return renderPlayView();
            if (state.view === 'scorecard') return renderScorecardView();
            return '';
        }

        function renderSetupView() {
            var modesHTML = Object.keys(gameModeInstructions).map(function(mode) {
                return '<div class="flex gap-2 mb-2">' +
                    '<button onclick="handleGameModeChange(\'' + mode + '\')" class="flex-1 flex justify-between items-center p-3 rounded-xl font-bold text-sm transition-all ' + (state.gameMode === mode ? 'bg-green-600 text-white shadow-lg' : 'bg-gray-800 text-gray-400 hover:bg-gray-700') + '">' +
                        mode +
                        (state.gameMode === mode ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' : '') +
                    '</button>' +
                    '<button onclick="state.showInfo = \'' + mode + '\'; render();" class="w-11 h-11 bg-gray-800 rounded-xl flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 active:scale-95 transition-all">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' +
                    '</button>' +
                '</div>';
            }).join('');

            var numPlayersHTML = [2, 3, 4].map(function(num) {
                var disabled = (state.gameMode === 'Wolf' && num < 3) || (state.gameMode === 'Vegas' && num !== 3 && num !== 4) || (state.gameMode === 'Nines' && num !== 3);
                return '<button ' + (disabled ? 'disabled' : '') + ' onclick="state.numPlayers = ' + num + '; render();" class="flex-1 py-3 rounded-xl font-black text-xl transition-all ' + (disabled ? 'opacity-30 bg-gray-800 text-gray-600' : (state.numPlayers === num ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-800 text-gray-400 hover:bg-gray-700')) + '">' +
                    num +
                '</button>';
            }).join('');

            var namesHTML = '';
            if (state.gameMode === 'Vegas' && state.numPlayers === 4) {
                namesHTML = '<div class="bg-blue-900/10 border border-blue-900/50 p-3 rounded-xl mb-3 shadow-lg">' +
                    '<div class="text-center text-[10px] font-black mb-2 text-blue-400 uppercase tracking-widest">Team 1</div>' +
                    '<div class="flex items-center bg-blue-900/30 p-2.5 rounded-lg mb-2 border border-blue-800"><input type="text" placeholder="Player 1" value="' + escapeHTML(state.playerNames[0]) + '" oninput="state.playerNames[0] = this.value; saveToStorage();" class="bg-transparent text-white font-bold text-sm w-full outline-none"/></div>' +
                    '<div class="flex items-center bg-blue-900/30 p-2.5 rounded-lg border border-blue-800"><input type="text" placeholder="Player 2" value="' + escapeHTML(state.playerNames[1]) + '" oninput="state.playerNames[1] = this.value; saveToStorage();" class="bg-transparent text-white font-bold text-sm w-full outline-none"/></div>' +
                '</div>' +
                '<div class="bg-emerald-900/10 border border-emerald-900/50 p-3 rounded-xl shadow-lg">' +
                    '<div class="text-center text-[10px] font-black mb-2 text-emerald-400 uppercase tracking-widest">Team 2</div>' +
                    '<div class="flex items-center bg-emerald-900/30 p-2.5 rounded-lg mb-2 border border-emerald-800"><input type="text" placeholder="Player 3" value="' + escapeHTML(state.playerNames[2]) + '" oninput="state.playerNames[2] = this.value; saveToStorage();" class="bg-transparent text-white font-bold text-sm w-full outline-none"/></div>' +
                    '<div class="flex items-center bg-emerald-900/30 p-2.5 rounded-lg border border-emerald-800"><input type="text" placeholder="Player 4" value="' + escapeHTML(state.playerNames[3]) + '" oninput="state.playerNames[3] = this.value; saveToStorage();" class="bg-transparent text-white font-bold text-sm w-full outline-none"/></div>' +
                '</div>';
            } else {
                for (var i = 0; i < state.numPlayers; i++) {
                    namesHTML += '<div class="flex items-center bg-gray-800 p-2.5 rounded-xl mb-2 border border-gray-700">' +
                        '<input type="text" placeholder="Player ' + (i + 1) + '" value="' + escapeHTML(state.playerNames[i]) + '" oninput="state.playerNames[' + i + '] = this.value; saveToStorage();" class="bg-transparent text-white font-bold text-sm w-full outline-none"/>' +
                    '</div>';
                }
            }

            return '<div class="flex-1 overflow-y-auto p-4 pb-20">' +
                '<div class="mb-5"><label class="text-[10px] font-bold text-gray-500 mb-2 block uppercase tracking-widest">Select Game</label>' + modesHTML + '</div>' +
                '<div class="mb-5"><label class="text-[10px] font-bold text-gray-500 mb-2 block uppercase tracking-widest">How many players?</label><div class="flex gap-2">' + numPlayersHTML + '</div></div>' +
                '<div class="mb-5"><label class="text-[10px] font-bold text-gray-500 mb-2 block uppercase tracking-widest">Starting Hole</label>' +
                    '<div class="flex items-center justify-between bg-gray-900 p-2 rounded-xl border border-gray-800 shadow-inner">' +
                        '<button onclick="updateStartingHole(state.startingHole === 1 ? 18 : state.startingHole - 1)" class="w-12 h-12 bg-gray-800 rounded-lg text-white font-black text-xl flex items-center justify-center hover:bg-gray-700 active:scale-95 transition-all shadow">-</button>' +
                        '<div class="flex items-center gap-2 font-black text-2xl text-white"><span>⛳</span><span>' + state.startingHole + '</span></div>' +
                        '<button onclick="updateStartingHole(state.startingHole === 18 ? 1 : state.startingHole + 1)" class="w-12 h-12 bg-gray-800 rounded-lg text-white font-black text-xl flex items-center justify-center hover:bg-gray-700 active:scale-95 transition-all shadow">+</button>' +
                    '</div>' +
                '</div>' +
                '<div class="mb-5"><label class="text-[10px] font-bold text-gray-500 mb-2 block uppercase tracking-widest">Player Names</label>' + namesHTML + '</div>' +
                '<button onclick="handleStartRound()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black text-base shadow-lg active:scale-95 transition-transform">START ROUND</button>' +
            '</div>';
        }

        function renderPlayView() {
            var wolfIdx = state.gameMode === 'Wolf' ? getWolfIndexForHole(state.currentHole, state.players) : 0;
            var currentWolf = state.gameMode === 'Wolf' ? state.players[wolfIdx] : null;
            var unplayedHoles = state.players[0] ? state.players[0].scores.filter(function(s) { return s === null; }).length : 18;
            var saveButtonText = 'SAVE HOLE';
            if (unplayedHoles === 0) saveButtonText = 'UPDATE HOLE';
            else if (unplayedHoles === 1 && state.players[0].scores[state.currentHole - 1] === null) saveButtonText = 'FINISH ROUND';

            var wolfBoxHTML = '';
            if (state.gameMode === 'Wolf' && currentWolf) {
                var partnersHTML = '<button onclick="state.wolfPartner = \'lone\'; state.errorMessage = null; render();" class="px-3 py-2 rounded-lg text-xs font-bold transition-colors ' + (state.wolfPartner === 'lone' ? 'bg-amber-600 text-white shadow-lg' : 'bg-gray-800 text-gray-400 border border-gray-700') + '">Lone Wolf</button>';
                state.players.filter(function(p) { return p.id !== currentWolf.id; }).forEach(function(p) {
                    partnersHTML += '<button onclick="state.wolfPartner = \'' + p.id + '\'; state.errorMessage = null; render();" class="px-3 py-2 rounded-lg text-xs font-bold transition-colors ' + (state.wolfPartner === p.id ? 'bg-amber-600 text-white shadow-lg' : 'bg-gray-800 text-gray-400 border border-gray-700') + '">Partner: ' + escapeHTML(p.name) + '</button>';
                });
                wolfBoxHTML = '<div class="bg-amber-900/30 border border-amber-800 p-3 rounded-xl mb-4">' +
                    '<div class="flex justify-center items-center gap-3 mb-3">' +
                        '<h3 class="text-amber-400 font-black uppercase tracking-widest text-xs flex items-center gap-1.5"><span>🐺</span> ' + escapeHTML(currentWolf.name) + '\'s Choice (Required)</h3>' +
                        (state.carryover > 0 ? '<span class="bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded animate-pulse">+' + state.carryover + ' Carry</span>' : '') +
                    '</div>' +
                    '<div class="grid grid-cols-2 gap-2">' + partnersHTML + '</div>' +
                '</div>';
            }

            var bbbBoxHTML = '';
            if (state.gameMode === 'Bingo Bango Bongo') {
                var bbbTypes = ['bingo', 'bango', 'bongo'];
                bbbBoxHTML = '<div class="bg-purple-900/30 border border-purple-800 p-3 rounded-xl mb-4"><h3 class="text-white font-bold text-xs mb-3 text-center">Tap to Assign Points</h3>';
                bbbTypes.forEach(function(type) {
                    bbbBoxHTML += '<div class="mb-3 last:mb-0"><label class="text-purple-300 uppercase text-[10px] font-black block mb-1.5 tracking-wider">' + type + '</label><div class="grid grid-cols-2 gap-1.5">';
                    state.players.forEach(function(p) {
                        bbbBoxHTML += '<button onclick="state.bbbWinners[\'' + type + '\'] = \'' + p.id + '\'; render();" class="px-2 py-2 rounded-lg text-xs font-bold transition-colors ' + (state.bbbWinners[type] === p.id ? 'bg-purple-600 text-white shadow-lg' : 'bg-gray-800 text-gray-400 border border-gray-700') + '">' + escapeHTML(p.name) + '</button>';
                    });
                    bbbBoxHTML += '</div></div>';
                });
                bbbBoxHTML += '</div>';
            }

            var playersHTML = '';
            if (state.gameMode === 'Vegas' && state.numPlayers === 4) {
                playersHTML = '<div class="bg-blue-900/10 border border-blue-900/50 p-2.5 rounded-xl space-y-2.5 mb-3 shadow-lg">' +
                    '<div class="flex justify-between items-center mb-1"><h3 class="text-blue-400 font-black uppercase text-[10px] tracking-widest">Team 1</h3>' +
                    '<button onclick="state.vegasBirdies.team1 = !state.vegasBirdies.team1; render();" class="text-[9px] font-black uppercase px-2 py-0.5 rounded border ' + (state.vegasBirdies.team1 ? 'bg-yellow-500 text-black border-yellow-400' : 'bg-gray-800 text-gray-400 border-gray-700') + '">' + (state.vegasBirdies.team1 ? '★ Birdie+' : 'Birdie?') + '</button></div>' +
                    renderPlayerScoreRow(state.players[0]) + renderPlayerScoreRow(state.players[1]) +
                '</div>' +
                '<div class="bg-emerald-900/10 border border-emerald-900/50 p-2.5 rounded-xl space-y-2.5 shadow-lg">' +
                    '<div class="flex justify-between items-center mb-1"><h3 class="text-emerald-400 font-black uppercase text-[10px] tracking-widest">Team 2</h3>' +
                    '<button onclick="state.vegasBirdies.team2 = !state.vegasBirdies.team2; render();" class="text-[9px] font-black uppercase px-2 py-0.5 rounded border ' + (state.vegasBirdies.team2 ? 'bg-yellow-500 text-black border-yellow-400' : 'bg-gray-800 text-gray-400 border-gray-700') + '">' + (state.vegasBirdies.team2 ? '★ Birdie+' : 'Birdie?') + '</button></div>' +
                    renderPlayerScoreRow(state.players[2]) + renderPlayerScoreRow(state.players[3]) +
                '</div>';
            } else if (state.gameMode === 'Vegas' && state.numPlayers === 3) {
                var rotatingIdx = (state.currentHole - 1) % 3;
                playersHTML = '<div class="bg-indigo-900/20 border border-indigo-800 p-3 rounded-xl mb-3 shadow-lg">' +
                    '<div class="text-center text-[10px] font-black mb-2 text-indigo-400 uppercase tracking-widest">Rotating Partner: ' + escapeHTML(state.players[rotatingIdx].name) + '</div>';
                state.players.forEach(function(p, idx) {
                    var totalPts = p.points.reduce(function(a, b) { return a + (b || 0); }, 0);
                    var keyName = 'p' + (idx + 1);
                    playersHTML += '<div class="flex items-center justify-between p-3 rounded-xl border bg-gray-800 border-gray-700 mb-2 last:mb-0 shadow-inner">' +
                        '<div class="flex flex-col"><div class="font-bold text-white text-sm flex items-center gap-1.5">' + escapeHTML(p.name) + (idx === rotatingIdx ? '<span class="text-[9px] bg-indigo-600 text-white px-1.5 py-0.5 rounded">Partner</span>' : '') + '</div><span class="text-[10px] font-black text-fuchsia-400">' + totalPts + ' Pts</span></div>' +
                        '<div class="flex items-center gap-2">' +
                            '<button onclick="state.vegasBirdies[\'' + keyName + '\'] = !state.vegasBirdies[\'' + keyName + '\']; render();" class="text-[9px] font-black uppercase px-1.5 py-1 rounded border ' + (state.vegasBirdies[keyName] ? 'bg-yellow-500 text-black border-yellow-400' : 'bg-gray-900 text-gray-400 border-gray-700') + '">' + (state.vegasBirdies[keyName] ? '★ Birdie' : 'Birdie?') + '</button>' +
                            '<div class="flex items-center gap-1.5 bg-gray-900 p-1 rounded-lg border border-gray-700">' +
                                '<button onclick="adjustScore(\'' + p.id + '\', -1)" class="w-8 h-8 bg-gray-800 rounded text-white font-black text-lg flex items-center justify-center hover:bg-gray-700">-</button>' +
                                '<div class="w-5 text-center font-black text-base text-white">' + state.tempScores[p.id] + '</div>' +
                                '<button onclick="adjustScore(\'' + p.id + '\', 1)" class="w-8 h-8 bg-gray-800 rounded text-white font-black text-lg flex items-center justify-center hover:bg-gray-700">+</button>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                });
                playersHTML += '</div>';
            } else {
                state.players.forEach(function(p) {
                    playersHTML += renderPlayerScoreRow(p);
                });
            }

            return '<div class="flex flex-col h-full bg-gray-900 overflow-hidden">' +
                '<div class="p-3 flex-1 overflow-y-auto">' +
                    '<div class="flex items-center justify-between mb-4 bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-xl">' +
                        '<button onclick="changeHole(state.currentHole === 1 ? 18 : state.currentHole - 1)" class="p-2.5 bg-gray-900 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 active:scale-95 transition-all shadow-inner"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>' +
                        '<div class="text-center"><h2 class="text-gray-400 font-black tracking-widest text-[10px] uppercase mb-0.5">Hole</h2><div class="text-4xl font-black text-white leading-none">' + state.currentHole + '</div></div>' +
                        '<button onclick="changeHole(state.currentHole === 18 ? 1 : state.currentHole + 1)" class="p-2.5 bg-gray-900 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 active:scale-95 transition-all shadow-inner"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>' +
                    '</div>' +
                    (state.gameMode === 'Stableford' ? '<div class="flex flex-col items-center mb-4 bg-gray-800/50 p-3 rounded-xl border border-gray-700"><span class="text-gray-400 font-bold text-[10px] uppercase tracking-widest mb-2">Adjust Hole Par</span><div class="flex items-center gap-4 bg-gray-900 p-1.5 rounded-lg border border-gray-700 shadow-inner"><button onclick="adjustPar(-1)" class="w-10 h-10 bg-gray-800 rounded text-white font-black text-xl flex items-center justify-center hover:bg-gray-700">-</button><span class="w-10 text-center text-2xl text-white font-black">' + state.holePars[state.currentHole - 1] + '</span><button onclick="adjustPar(1)" class="w-10 h-10 bg-gray-800 rounded text-white font-black text-xl flex items-center justify-center hover:bg-gray-700">+</button></div></div>' : '') +
                    wolfBoxHTML + bbbBoxHTML +
                    (state.errorMessage ? '<div class="bg-red-900/40 border border-red-700 text-red-300 text-xs font-bold p-2.5 rounded-xl mb-3 text-center">' + state.errorMessage + '</div>' : '') +
                    '<div class="space-y-2">' + playersHTML + '</div>' +
                '</div>' +
                '<div class="p-3 bg-gray-900 border-t border-gray-800 shrink-0">' +
                    '<button onclick="handleSaveHole()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-black text-base shadow-lg active:scale-95 transition-transform">' + saveButtonText + '</button>' +
                '</div>' +
            '</div>';
        }

        function renderPlayerScoreRow(p) {
            var isWolf = state.gameMode === 'Wolf' && state.players[getWolfIndexForHole(state.currentHole, state.players)].id === p.id;
            var totalPts = p.points.reduce(function(a, b) { return a + (b || 0); }, 0);
            return '<div class="flex items-center justify-between p-3 rounded-xl border ' + (isWolf ? 'bg-amber-900/20 border-amber-700/50' : 'bg-gray-800 border-gray-700') + '">' +
                '<div class="flex flex-col">' +
                    '<div class="font-bold text-white text-sm flex items-center gap-1.5">' + (isWolf ? '<span>🐺</span>' : '') + escapeHTML(p.name) + '</div>' +
                    '<span class="text-[10px] font-black text-fuchsia-400">' + totalPts + ' Pts</span>' +
                '</div>' +
                '<div class="flex items-center gap-3 bg-gray-900 p-1 rounded-lg border border-gray-700">' +
                    '<button onclick="adjustScore(\'' + p.id + '\', -1)" class="w-10 h-10 bg-gray-800 rounded text-white font-black text-xl flex items-center justify-center hover:bg-gray-700 active:scale-95">-</button>' +
                    '<div class="w-6 text-center font-black text-xl text-white">' + state.tempScores[p.id] + '</div>' +
                    '<button onclick="adjustScore(\'' + p.id + '\', 1)" class="w-10 h-10 bg-gray-800 rounded text-white font-black text-xl flex items-center justify-center hover:bg-gray-700 active:scale-95">+</button>' +
                '</div>' +
            '</div>';
        }

        function renderScorecardView() {
            var totals = {};
            state.players.forEach(function(p) {
                totals[p.id] = {
                    strokes: p.scores.reduce(function(a, b) { return a + (b || 0); }, 0),
                    pts: p.points.reduce(function(a, b) { return a + (b || 0); }, 0)
                };
            });

            var headersHTML = '<th class="p-2.5 text-left sticky top-0 left-0 z-30 bg-gray-900 border-r border-b border-gray-800 text-gray-500 font-black uppercase text-[10px]">Hole</th>';
            state.players.forEach(function(p) {
                headersHTML += '<th class="p-2.5 text-center sticky top-0 z-20 bg-gray-900 border-b border-gray-800 font-bold text-white whitespace-nowrap min-w-[80px]">' +
                    '<div class="flex flex-col items-center">' +
                        '<span class="text-xs font-black">' + escapeHTML(p.name) + '</span>' +
                        '<span class="text-[9px] font-black text-fuchsia-400 bg-purple-950/80 px-1.5 py-0.5 rounded-full mt-0.5 border border-purple-800">' + totals[p.id].pts + ' PTS</span>' +
                    '</div>' +
                '</th>';
            });

            var rowsHTML = '';
            for (var i = 0; i < 18; i++) {
                rowsHTML += '<tr class="border-b border-gray-800/50 hover:bg-gray-800/20">' +
                    '<td class="p-3 border-r border-gray-800 sticky left-0 z-10 bg-gray-900 font-black text-gray-400 text-xs flex flex-col gap-0.5 items-center justify-center"><span>' + (i + 1) + '</span>' + (state.gameMode === 'Stableford' ? '<span class="text-[9px] text-gray-600 bg-gray-800 inline-block px-1 rounded">P' + state.holePars[i] + '</span>' : '') + '</td>';
                state.players.forEach(function(p) {
                    var sc = p.scores[i];
                    var pt = p.points[i];
                    var ptClass = pt > 0 ? 'text-fuchsia-400' : pt < 0 ? 'text-red-400' : 'text-gray-600';
                    rowsHTML += '<td class="p-1.5 text-center align-middle">' +
                        '<div class="flex flex-col items-center justify-center">' +
                            '<span class="text-gray-300 font-mono text-base font-bold leading-none mt-0.5">' + (sc !== null ? sc : '-') + '</span>' +
                            (sc !== null && pt !== null ? '<span class="text-[9px] font-black uppercase tracking-widest mt-0.5 ' + ptClass + '">' + (pt > 0 ? '+' : '') + pt + ' pts</span>' : '') +
                        '</div>' +
                    '</td>';
                });
                rowsHTML += '</tr>';
            }

            var totRow = '<tr class="row-tot"><td class="p-3 border-r border-gray-700 sticky left-0 z-10 bg-gray-800 text-gray-300 text-xs">TOT</td>';
            state.players.forEach(function(p) { totRow += '<td class="p-3 text-center text-lg text-yellow-400">' + (totals[p.id].strokes || '-') + '</td>'; });
            totRow += '</tr>';

            var ptsRow = '<tr class="row-pts"><td class="p-3 border-r border-purple-800 sticky left-0 z-10 bg-purple-900 text-purple-300 text-xs">PTS</td>';
            state.players.forEach(function(p) { ptsRow += '<td class="p-3 text-center text-xl text-fuchsia-300">' + totals[p.id].pts + '</td>'; });
            ptsRow += '</tr>';

            return '<div class="flex flex-col h-full bg-gray-950 overflow-hidden">' +
                '<div class="p-3 bg-gray-900 shrink-0 z-40 border-b border-gray-800 flex justify-between items-center shadow-lg relative">' +
                    '<div><h2 class="text-sm font-black text-white">' + state.gameMode + '</h2><p class="text-gray-400 text-[9px] uppercase font-bold tracking-wider">Scorecard</p></div>' +
                    '<div class="flex items-center gap-2"><span class="text-gray-300 text-xs font-bold">' + state.numPlayers + ' Players</span></div>' +
                '</div>' +
                '<div class="table-wrapper"><table><thead><tr>' + headersHTML + '</tr></thead><tbody>' + rowsHTML + totRow + ptsRow + '</tbody></table></div>' +
            '</div>';
        }

        function renderModals() {
            var html = '';
            if (state.showInfo) {
                html += '<div class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">' +
                    '<div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl w-full max-w-sm shadow-2xl">' +
                        '<div class="flex justify-between items-start mb-3"><h3 class="text-white font-black text-base">' + escapeHTML(state.showInfo) + '</h3><button onclick="state.showInfo = null; render();" class="text-gray-500 bg-gray-800 rounded-full p-1 hover:text-white"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>' +
                        '<p class="text-gray-300 text-xs leading-relaxed font-medium mb-4">' + gameModeInstructions[state.showInfo] + '</p>' +
                        '<button onclick="state.showInfo = null; render();" class="w-full bg-gray-800 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-gray-700">Got it</button>' +
                    '</div>' +
                '</div>';
            }
            if (state.showHomeConfirm) {
                html += '<div class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">' +
                    '<div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl w-full max-w-sm shadow-2xl">' +
                        '<h3 class="text-red-400 font-black text-base mb-1.5">End Round?</h3>' +
                        '<p class="text-gray-300 text-xs leading-relaxed font-medium mb-4">Are you sure you want to go back to the main menu? All saved scores will be cleared.</p>' +
                        '<div class="flex gap-2.5">' +
                            '<button onclick="state.showHomeConfirm = false; render();" class="flex-1 bg-gray-800 text-white py-2.5 rounded-xl font-bold text-xs">Cancel</button>' +
                            '<button onclick="localStorage.removeItem(\'golf_app_state\'); location.reload();" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-lg">End Round</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }
            return html;
        }

        function handleGameModeChange(mode) {
            state.gameMode = mode;
            if (mode === 'Vegas' && state.numPlayers !== 3 && state.numPlayers !== 4) state.numPlayers = 4;
            if (mode === 'Nines') state.numPlayers = 3;
            if (state.gameMode === 'Wolf' && state.numPlayers < 3) state.numPlayers = 3;
            if (state.numPlayers < 2) state.numPlayers = 2;
            render();
        }

        function updateStartingHole(val) {
            state.startingHole = val;
            render();
        }

        function adjustPar(amount) {
            state.holePars[state.currentHole - 1] = Math.max(3, Math.min(5, state.holePars[state.currentHole - 1] + amount));
            render();
        }

        function adjustScore(id, amount) {
            state.tempScores[id] = Math.max(1, (state.tempScores[id] || 4) + amount);
            render();
        }

        function getWolfIndexForHole(holeNum, currentPlayers) {
            var sequenceIndex = 0;
            var currentSeqIdx = -1;
            for (var i = 0; i < 18; i++) {
                var actualHoleNumber = ((state.startingHole - 1 + i) % 18) + 1;
                if (actualHoleNumber === holeNum) currentSeqIdx = sequenceIndex;
                sequenceIndex++;
            }

            var playedHolesCount = currentPlayers[0].scores.filter(function(s) { return s !== null; }).length;
            var unplayedHolesCount = 18 - playedHolesCount;
            var isFinalTwoHoles = (unplayedHolesCount <= 2);

            if (state.numPlayers === 4 && isFinalTwoHoles && currentSeqIdx > 0) {
                var totalPoints = currentPlayers.map(function(p) {
                    var pts = 0;
                    for (var i = 0; i < currentSeqIdx; i++) {
                        var hIndex = (state.startingHole - 1 + i) % 18;
                        if (p.points[hIndex] !== null) pts += p.points[hIndex];
                    }
                    return { id: p.id, points: pts };
                });
                totalPoints.sort(function(a, b) { return a.points - b.points; });
                var lowestPoints = totalPoints[0].points;
                var tiedLowest = totalPoints.filter(function(p) { return p.points === lowestPoints; });

                var chosenId;
                if (tiedLowest.length === 1) {
                    chosenId = tiedLowest[0].id;
                } else {
                    var defaultRotationIndex = (state.initialWolfIndex + currentSeqIdx) % currentPlayers.length;
                    for (var offset = 0; offset < currentPlayers.length; offset++) {
                        var checkIdx = (defaultRotationIndex + offset) % currentPlayers.length;
                        var checkId = currentPlayers[checkIdx].id;
                        if (tiedLowest.some(function(p) { return p.id === checkId; })) { chosenId = checkId; break; }
                    }
                }
                return currentPlayers.findIndex(function(p) { return p.id === chosenId; });
            }
            return (state.initialWolfIndex + currentSeqIdx) % currentPlayers.length;
        }

        function changeHole(newHole) {
            state.currentHole = newHole;
            state.players.forEach(function(p) { state.tempScores[p.id] = p.scores[newHole - 1] || 4; });
            state.bbbWinners = { bingo: null, bango: null, bongo: null };
            state.wolfPartner = null;
            state.vegasBirdies = { team1: false, team2: false, p1: false, p2: false, p3: false };
            state.errorMessage = null;
            render();
        }

        function handleStartRound() {
            var initialPlayers = [];
            for (var i = 0; i < state.numPlayers; i++) {
                initialPlayers.push({
                    id: 'p' + i,
                    name: state.playerNames[i] || ('Player ' + (i + 1)),
                    scores: Array(18).fill(null),
                    points: Array(18).fill(null)
                });
            }
            state.players = initialPlayers;
            state.initialWolfIndex = Math.floor(Math.random() * state.numPlayers);
            state.currentHole = state.startingHole;
            state.holePars = Array(18).fill(4);
            var initialTemp = {};
            initialPlayers.forEach(function(p) { initialTemp[p.id] = 4; });
            state.tempScores = initialTemp;
            state.bbbWinners = { bingo: null, bango: null, bongo: null };
            state.wolfPartner = null;
            state.carryover = 0;
            state.vegasBirdies = { team1: false, team2: false, p1: false, p2: false, p3: false };
            state.errorMessage = null;
            state.view = 'play';
            render();
        }

        function calculatePoints() {
            var pts = {};
            var resultIsTie = false;
            state.players.forEach(function(p) { pts[p.id] = 0; });

            if (state.gameMode === 'Bingo Bango Bongo') {
                if (state.bbbWinners.bingo) pts[state.bbbWinners.bingo] += 1;
                if (state.bbbWinners.bango) pts[state.bbbWinners.bango] += 1;
                if (state.bbbWinners.bongo) pts[state.bbbWinners.bongo] += 1;
            } else if (state.gameMode === 'Vegas' && state.numPlayers === 4) {
                var t1 = [state.players[0].id, state.players[1].id];
                var t2 = [state.players[2].id, state.players[3].id];
                var getVegasScore = function(s1, s2, flip) {
                    var low = Math.min(s1, s2), high = Math.max(s1, s2);
                    return flip ? high * 10 + low : low * 10 + high;
                };
                var bothBirdie = state.vegasBirdies.team1 && state.vegasBirdies.team2;
                var flip1 = state.vegasBirdies.team2 && !bothBirdie;
                var flip2 = state.vegasBirdies.team1 && !bothBirdie;
                var s1 = getVegasScore(state.tempScores[t1[0]], state.tempScores[t1[1]], flip1);
                var s2 = getVegasScore(state.tempScores[t2[0]], state.tempScores[t2[1]], flip2);
                var diff = Math.abs(s1 - s2);
                if (s1 < s2) { t1.forEach(function(id) { pts[id] = diff; }); }
                else if (s2 < s1) { t2.forEach(function(id) { pts[id] = diff; }); }
            } else if (state.gameMode === 'Vegas' && state.numPlayers === 3) {
                var rotatingIdx = (state.currentHole - 1) % 3;
                var pAId = state.players[rotatingIdx].id;
                var otherPlayers = state.players.filter(function(_, idx) { return idx !== rotatingIdx; });
                var pBId = otherPlayers[0].id, pCId = otherPlayers[1].id;
                var getVegasScore3 = function(s1, s2, flip) {
                    var low = Math.min(s1, s2), high = Math.max(s1, s2);
                    return flip ? high * 10 + low : low * 10 + high;
                };
                var bA = state.vegasBirdies['p' + (rotatingIdx + 1)];
                var bB = state.vegasBirdies['p' + (state.players.findIndex(function(p) { return p.id === pBId; }) + 1)];
                var bC = state.vegasBirdies['p' + (state.players.findIndex(function(p) { return p.id === pCId; }) + 1)];
                var flipTeam1 = (bC && !bA && !bB);
                var flipTeam2 = (bB && !bA && !bC);
                var s1_3 = getVegasScore3(state.tempScores[pAId], state.tempScores[pBId], flipTeam1);
                var s2_3 = getVegasScore3(state.tempScores[pAId], state.tempScores[pCId], flipTeam2);
                var diff3 = Math.abs(s1_3 - s2_3);
                if (s1_3 < s2_3) { pts[pAId] += diff3; pts[pBId] += diff3; }
                else if (s2_3 < s1_3) { pts[pAId] += diff3; pts[pCId] += diff3; }
            } else if (state.gameMode === 'Wolf' && state.numPlayers >= 3) {
                var wolfIdx = getWolfIndexForHole(state.currentHole, state.players);
                var currentWolfId = state.players[wolfIdx].id;
                var activePartner = state.wolfPartner;

                if (activePartner === 'lone') {
                    var wolfScore = state.tempScores[currentWolfId];
                    var bestPackScore = Math.min.apply(null, state.players.filter(function(p) { return p.id !== currentWolfId; }).map(function(p) { return state.tempScores[p.id]; }));
                    var totalStake = 2 + state.carryover;

                    if (wolfScore < bestPackScore) {
                        pts[currentWolfId] = totalStake;
                    } else if (bestPackScore < wolfScore) {
                        state.players.filter(function(p) { return p.id !== currentWolfId; }).forEach(function(p) {
                            pts[p.id] = totalStake;
                        });
                    } else {
                        resultIsTie = true;
                    }
                } else {
                    var wolfTeam = [currentWolfId, activePartner];
                    var pack = state.players.filter(function(p) { return !wolfTeam.includes(p.id); }).map(function(p) { return p.id; });
                    var wolfScore = Math.min.apply(null, wolfTeam.map(function(id) { return state.tempScores[id]; }));
                    var packScore = Math.min.apply(null, pack.map(function(id) { return state.tempScores[id]; }));
                    var holeValue = 1 + state.carryover;
                    if (wolfScore < packScore) { wolfTeam.forEach(function(id) { pts[id] = holeValue; }); }
                    else if (packScore < wolfScore) { pack.forEach(function(id) { pts[id] = holeValue; }); }
                    else { resultIsTie = true; }
                }
            } else if (state.gameMode === 'Stableford') {
                var currentPar = state.holePars[state.currentHole - 1];
                state.players.forEach(function(p) {
                    var score = state.tempScores[p.id];
                    var holePts = Math.max(0, currentPar - score + 2);
                    if (score === 1) holePts = 5;
                    pts[p.id] = holePts;
                });
            } else if (state.gameMode === 'Nines' && state.numPlayers === 3) {
                var scoreData = state.players.map(function(p) { return { id: p.id, score: state.tempScores[p.id] }; }).sort(function(a, b) { return a.score - b.score; });
                var low = scoreData[0].score, mid = scoreData[1].score, high = scoreData[2].score;
                if (mid - low >= 2) { pts[scoreData[0].id] = 9; }
                else if (low === mid && mid === high) { pts[scoreData[0].id] = 3; pts[scoreData[1].id] = 3; pts[scoreData[2].id] = 3; }
                else if (low === mid && mid < high) { pts[scoreData[0].id] = 4; pts[scoreData[1].id] = 4; pts[scoreData[2].id] = 1; }
                else if (low < mid && mid === high) { pts[scoreData[0].id] = 5; pts[scoreData[1].id] = 2; pts[scoreData[2].id] = 2; }
                else { pts[scoreData[0].id] = 5; pts[scoreData[1].id] = 3; pts[scoreData[2].id] = 1; }
            }
            return { pts: pts, resultIsTie: resultIsTie };
        }

        function recalculateWolfCarryovers() {
            if (state.gameMode !== 'Wolf') return;
            var currentCarry = 0;
            for (var i = 0; i < 18; i++) {
                var hNum = ((state.startingHole - 1 + i) % 18) + 1;
                var isPlayed = state.players[0].scores[hNum - 1] !== null;
                if (!isPlayed) continue;

                var wolfIdx = getWolfIndexForHole(hNum, state.players);
                var wolfId = state.players[wolfIdx].id;
                var wolfSc = state.players.find(function(p) { return p.id === wolfId; }).scores[hNum - 1];
                var bestOther = Math.min.apply(null, state.players.filter(function(p) { return p.id !== wolfId; }).map(function(p) { return p.scores[hNum - 1]; }));
                
                if (wolfSc === bestOther) {
                    currentCarry += 1;
                } else {
                    currentCarry = 0;
                }
            }
            state.carryover = currentCarry;
        }

        function handleSaveHole() {
            if (state.gameMode === 'Wolf' && !state.wolfPartner) {
                state.errorMessage = 'Please select a partner or Lone Wolf before saving!';
                render();
                return;
            }
            state.errorMessage = null;

            var calc = calculatePoints();
            var pts = calc.pts;

            state.players = state.players.map(function(p) {
                var newScores = p.scores.slice();
                newScores[state.currentHole - 1] = state.tempScores[p.id];
                var newPointsArr = p.points.slice();
                newPointsArr[state.currentHole - 1] = pts[p.id];
                return Object.assign({}, p, { scores: newScores, points: newPointsArr });
            });

            if (state.gameMode === 'Wolf') {
                recalculateWolfCarryovers();
            }

            var unplayedHoles = state.players[0].scores.filter(function(s) { return s === null; }).length;
            if (unplayedHoles === 0) {
                state.view = 'scorecard';
            } else {
                var nextHole = state.currentHole === 18 ? 1 : state.currentHole + 1;
                changeHole(nextHole);
            }
            render();
        }

        window.onload = function() {
            loadFromStorage();
            render();
        };
    </script>
</body>
</html>
